org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.parallel=false
org.gradle.caching=false

# Kotlin
kotlin.code.style=official
kotlin.multiplatform.stability.nowarn=true

# Android
android.useAndroidX=true
android.enableJetifier=false
android.enableR8.fullMode=true
android.enableResourceOptimizations=true
android.nonTransitiveRClass=true

# Compose
compose.kotlinCompilerExtensionVersion=1.5.15
kotlin.compiler.execution.strategy=in-process

org.jetbrains.compose.resources.disable.generate.actual=true
android.suppressUnsupportedCompileSdk=37,37.0



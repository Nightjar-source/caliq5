<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0F172A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="حاسبة الإعفاء والسعي لطلاب وطالبات العراق - كاليك 5 (Caliq 5)">
    <title>حاسبة الإعفاء والسعي لطلاب وطالبات العراق</title>
    <link rel="manifest" href="manifest.json">
    <style>
        html, body, #ComposeTarget {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0F172A;
            color: #F8FAFC;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #ComposeTarget {
            position: fixed;
            inset: 0;
            z-index: 10;
        }
        #pwa-loader {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background: linear-gradient(135deg, #1C5B7D 0%, #2A0845 100%);
            z-index: 1;
            text-align: center;
            padding: 24px;
        }
        .loader-title {
            font-size: 20px;
            font-weight: 700;
            color: #FFFFFF;
        }
        .spinner {
            width: 38px;
            height: 38px;
            border: 3px solid rgba(255, 255, 255, 0.22);
            border-top-color: #38BDF8;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="pwa-loader">
        <div class="spinner"></div>
        <div class="loader-title">حاسبة الإعفاء والسعي لطلاب وطالبات العراق</div>
    </div>
    <div id="ComposeTarget"></div>
    <script type="application/javascript" src="caliq5.js" defer></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
</html>

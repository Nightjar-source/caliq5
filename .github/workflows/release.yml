name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore Signing Credentials from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > androidApp/Nightjar.keystore
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> local.properties
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> local.properties
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set!"
          fi
          if [ -n "${{ secrets.ADMOB_APP_ID }}" ]; then
            echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >> local.properties
          fi
          if [ -n "${{ secrets.ADMOB_BANNER_ID }}" ]; then
            echo "ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }}" >> local.properties
          fi
          if [ -n "${{ secrets.ADMOB_INTERSTITIAL_ID }}" ]; then
            echo "ADMOB_INTERSTITIAL_ID=${{ secrets.ADMOB_INTERSTITIAL_ID }}" >> local.properties
          fi

      - name: Build Release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find androidApp/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          NAMED_APK="androidApp/build/outputs/apk/release/caliq5-${{ github.ref_name }}.apk"
          cp "$APK_PATH" "$NAMED_APK"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "named_apk=$NAMED_APK" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: steps.find_apk.outputs.apk_path != ''
        with:
          name: caliq5-release-apk
          path: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.find_apk.outputs.named_apk }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.find_apk.outputs.named_apk }}
          name: تطبيق كاليك 5 (Caliq 5) - حاسبة السعي والإعفاء لطلاب العراق ${{ github.ref_name }}
          body: |
            ## 🎓 تطبيق كاليك 5 (Caliq 5) - الإصدار ${{ github.ref_name }}
            **حاسبة السعي السنوي والإعفاء المدرسي لطلاب وطالبات جمهورية العراق**

            تطبيق تعليمي ذكي وشامل تم تطويره بأحدث تقنيات أندرويد وKotlin Multiplatform وCompose الحديثة، متوافق مع كافة الهواتف، الأجهزة اللوحية، الهواتف القابلة للطي (Foldables)، شاشات سامسونج ديكس (Samsung DeX)، ولابتوبات Googlebook OS.

            ---

            ### 🌟 مميزات التطبيق الشاملة:
            * **حساب السعي السنوي الدقيق:** حساب السعي وفقاً للضوابط الرسمية لوزارة التربية العراقية مع المعالجة الدقيقة لجبر الكسور والدرجات الحرجة.
            * **تحديد شروط الإعفاء العام والفردي:** فحص تلقائي وفوري لأهلية الطالب للإعفاء العام (معدل 85% فما فوق بدون أي درجة أقل من 75) أو الإعفاء الفردي (درجة 90% فما فوق للمادة).
            * **سجل "درجاتي" التفاعلي الشامل:** إدارة درجات جميع المواد الدراسية، حفظ وتعديل درجات الفصول ونصف السنة والامتحان النهائي بسهولة وأمان.
            * **تصدير وطباعة تقرير الدرجات (PDF):** توليد وثيقة درجات مدرسية رسمية وأنيقة للطباعة والمشاركة مع علامة مائية دقيقة لخلفية التطبيق وتنسيق جداول متقن.
            * **ودجت الشاشة الرئيسية المتكيف (Smart Home Widget):** وصول سريع ومباشر للحسابات مع دعم ألوان النظام الديناميكية (Material You).
            * **واجهة مستخدم متكيفة ومرنة (Material 3 Adaptive):** تجربة استخدام انسيابية وناعمة تتكيف تلقائياً مع الشاشات العريضة، الوضع الأفقي، والنوافذ العائمة مع حركة سائلة.
            * **دعم شامل لمختلف المنصات:** دعم التثبيت والاستخدام المتكامل على مختلف أجهزة أندرويد، الأجهزة المكتبية، والبيئات غير المحددة مسبقاً.

            ---
            *نسخة أصلية موثوقة وموقعة رقمياً.*
          draft: false
          prerelease: false
          generate_release_notes: true

name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore Signing Credentials from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > androidApp/Nightjar.keystore
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> local.properties
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> local.properties
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set!"
          fi
          if [ -n "${{ secrets.ADMOB_APP_ID }}" ]; then
            echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >> local.properties
          fi
          if [ -n "${{ secrets.ADMOB_BANNER_ID }}" ]; then
            echo "ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }}" >> local.properties
          fi
          if [ -n "${{ secrets.ADMOB_INTERSTITIAL_ID }}" ]; then
            echo "ADMOB_INTERSTITIAL_ID=${{ secrets.ADMOB_INTERSTITIAL_ID }}" >> local.properties
          fi

      - name: Build Release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find androidApp/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          NAMED_APK="androidApp/build/outputs/apk/release/caliq5-${{ github.ref_name }}.apk"
          cp "$APK_PATH" "$NAMED_APK"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "named_apk=$NAMED_APK" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: steps.find_apk.outputs.apk_path != ''
        with:
          name: caliq5-release-apk
          path: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.find_apk.outputs.named_apk }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.find_apk.outputs.named_apk }}
          name: حاسبة الإعفاء والسعي لطلاب وطالبات العراق - تطبيق كاليك 5 (Caliq 5) ${{ github.ref_name }}
          body: |
            # 🎓 حاسبة الإعفاء والسعي لطلاب وطالبات العراق - تطبيق كاليك 5 (Caliq 5)
            ### الإصدار الرسمي المعتمد: ${{ github.ref_name }}

            تطبيق تعليمي متكامل تم تصميمه وبرمجته خصيصاً لخدمة طلاب وطالبات وأولياء الأمور والكوادر التعليمية في كافة أنحاء جمهورية العراق، للمساعدة في احتساب السعي السنوي والمعدلات الفصلية والتحقق الدقيق من شروط وضوابط الإعفاء المدرسي وفقاً لأحدث التعليمات واللوائح الصادرة عن وزارة التربية العراقية للعام الدراسي 2024-2025 وما بعده (2026-2027).

            ---

            ### 📚 الصفوف والمراحل الدراسية المدعومة بالتطبيق:
            يتضمن التطبيق المواد الدراسية الرسمية لكل مرحلة مع إمكانية استبعاد المواد الاختيارية أو إضافة مواد مخصصة:
            * **الأول المتوسط:** يشمل المواد الأساسية (التربية الإسلامية، اللغة العربية، اللغة الإنكليزية، الرياضيات، الاجتماعيات، الأحياء، الكيمياء، الفيزياء) مع المواد الاختيارية (الحاسوب، اللغة الفرنسية، التربية الأخلاقية، الفنية، الرياضة).
            * **الثاني المتوسط:** يشمل كافة المواد المعتمدة للمرحلة مع إمكانية التخصيص والاستبعاد للمواد الاختيارية.
            * **الرابع العلمي:** المواد العلمية التخصصية (الرياضيات، الكيمياء، الفيزياء، الأحياء، الإسلامية، العربية، الإنكليزية) مع اللغات والمواد الإضافية (الحاسوب، الفرنسية، الكردية، جرائم البعث، الفنية، الرياضة).
            * **الرابع الأدبي:** المواد الأدبية التخصصية (التاريخ، الجغرافية، علم الاجتماع، الرياضيات، اللغات والإسلامية) مع المواد الاختيارية.
            * **الخامس العلمي:** المواد المنهجية (الرياضيات، الكيمياء، الفيزياء، الأحياء، الإسلامية، اللغات) مع المواد الإضافية المعتمدة.
            * **الخامس الأدبي:** المواد التخصصية (التاريخ، الجغرافية، الاقتصاد، الفلسفة، الرياضيات، اللغات) مع المواد الإضافية.
            * **صف مخصص (آخر):** إمكانية إنشاء وتسمية وإدارة صفوف ومواد مخصصة بالكامل لأي مرحلة أخرى.

            ---

            ### 🌟 شرح مفصل لميزات وأقسام التطبيق (من شاشة التعليمات):
            1. **حساب الإعفاء (العام والفردي):**
               * **الإعفاء الفردي:** فحص تلقائي لكل مادة على حدة؛ يُعفى الطالب من أداء الامتحان النهائي في أي مادة يحصل فيها على سعي سنوي 90% فأكثر.
               * **الإعفاء العام:** فحص شامل؛ يُشمل الطالب بالإعفاء العام في جميع المواد إذا حصل على معدل عام لا يقل عن 85% بشرط ألا تقل درجة السعي السنوي في أي مادة عن 75%.
               * **قاعدة جبر الكسور الرسمية:** تطبيق جبر الكسور التلقائي للسعي السنوي للمادة فقط: الدرجات بين (74.6% - 74.9%) تُجبر إلى 75%، والدرجات بين (89.6% - 89.9%) تُجبر إلى 90%. (تنبيه: المعدل العام 85% لا يُجبر وفقاً لتعليمات الوزارة).
            2. **درجاتي (السجل التفاعلي الشامل):**
               * بناء وحفظ وإدارة سجل درجات كامل للطلاب.
               * دعم طريقتي الإدخال: (معدل فصلي جاهز) أو (درجات الأشهر التراكمية).
               * الحساب التلقائي للسعي الفصلي، السعي السنوي، والدرجة النهائية بعد الامتحان النهائي أو الإعفاء.
               * تصدير السجل بصيغة وثيقة رسمية جاهزة للطباعة (PDF) مع علامة مائية دقيقة ومظهر أنيق.
            3. **حساب السعي السنوي للمادة:**
               * حساب السعي بدقة من درجات (الفصل الأول + نصف السنة + الفصل الثاني) مقسوماً على 3 مع تطبيق جبر الكسور.
            4. **حساب المعدل الفصلي:**
               * حساب متوسط درجات الامتحانات الشهرية للفصل الدراسي الواحد بدقة عشرية عالية.
            5. **حاسبة درجة الفصل الثاني المستهدفة:**
               * ميزة استباقية ذكية تحسب للطالب الدرجة التي يحتاجها بالضبط في امتحانات الفصل الثاني لتحقيق درجة سعي 75% أو 90% للوصول إلى الإعفاء.
            6. **الودجت الذكي للشاشة الرئيسية (Smart Home Widget):**
               * ودجت متكيف يعرض وصولاً سريعاً ومباشراً لأدوات الحساب ويدعم ألوان النظام الديناميكية (Material You).
            7. **التصميم المتكيف الفائق (Fluid Adaptive M3):**
               * تجربة استخدام ناعمة وسلسة بنظام Fluid Motion تعمل بكفاءة على كافة أحجام الشاشات، الوضعين الرأسي والأفقي، الأجهزة اللوحية، الهواتف القابلة للطي، وبيئات سطح المكتب والنوافذ الحرة (Samsung DeX وGooglebook OS).

            ---
            *تطبيق تعليمي آمن ومجاني 100% وموقع رقمياً بشهادة رسمية معتمدة.*
          draft: false
          prerelease: false
          generate_release_notes: true

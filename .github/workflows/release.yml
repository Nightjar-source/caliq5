name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore Signing Credentials from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > androidApp/Nightjar.keystore
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> local.properties
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> local.properties
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set!"
          fi

      - name: Build Release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find androidApp/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: steps.find_apk.outputs.apk_path != ''
        with:
          name: caliq5-release-apk
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          name: حاسبة الإعفاء والسعي لطلاب وطالبات العراق - تطبيق كاليك 5 (Caliq 5) ${{ github.ref_name }}
          body: |
            ### 🎓 حاسبة الإعفاء والسعي لطلاب وطالبات العراق - تطبيق كاليك 5 (Caliq 5) - الإصدار ${{ github.ref_name }}

            تطبيق تعليمي ذكي مخصص لطلاب وطالبات المراحل الدراسية في جمهورية العراق لحساب السعي السنوي، وتحديد شروط الإعفاء العام والفردي، وحساب المعدلات الفصلية وإدارة سجل الدرجات بأحدث تقنيات أندرويد وCompose Multiplatform.

            نسخة رسمية موقّعة ومشفرة تم بناؤها تلقائياً عبر مفاتيح التوقيع المشفرة الرسمية في GitHub Actions.

            #### 🌟 تفاصيل تحديث الإصدار ${{ github.ref_name }}:
            1. **تجسيم وتحدب أحجار البحر (Sea Glass Organic Convex Volume)**: تجسيم واضح ومرتفع ثلاثي الأبعاد مع ظل عائم ناعم من جنس اللون (Tone-on-tone) في كارتات الشرح، كارت المعدل، وشريط التنقل السفلي والجانبي بدون أي ظلال نشاز.
            2. **المؤشر السائل المتدفق (Fluid Liquid Droplet)**: مؤشر تنقل يحاكي التوتر السطحي لقطرة سائل حقيقية ومرنة مع تعميمه على زر ومؤشر القائمة الجانبية في الوضعين الفاتح والمظلم.
            3. **صلاحيات النوافذ العائمة وتقسيم الشاشة وفق معايير أندرويد 2026/2027**: دعم كامل للـ Freeform Windows وتقسيم الشاشة (Split-Screen) وSamsung DeX وXiaomi Pop-up مع ضبط مسافات الأمان (`captionBar` و `statusBars` و `displayCutout`) لمنع تداخل أزرار التحكم وامتداد خلفية التطبيق Edge-to-Edge.
            4. **ظلال نصوص ذكية فائقة التباين لكارتات الشرح**: كشف ديناميكي لدرجة إضاءة الخلفية مع إسقاط ظل تباين حاد ونقي للنصوص والألوان الداكنة والفاتحة وفق معايير WCAG وMaterial 3.
            5. **سلاسة فورية للمنسدلات واسترجاع الانيميشن الانزلاقي الرطب المتسلسل**: استرجاع كامل للانيميشن الانسيابي مع تأخير متسلسل ورطوبة فيزيائية، وحل مشكلة تأخر إغلاق منسدلة الألوان ومنسدلة الصفوف عبر إلغاء الضغط على خيط المعالجة الرئيسي.
            6. **تنظيف فوري للذاكرة والكاش عند الإغلاق وسحب التطبيق**: استخدام خدمة `CaliqCleanupService` عبر دالة `onTaskRemoved` لحذف الملفات المؤقتة والذاكرة مباشرة عند سحب التطبيق من الواجهة المتوافق من أندرويد 7 إلى 17 وواجهات Samsung One UI وXiaomi HyperOS.
            7. **اعتماد مكتبة التنقل الرسمية لـ Jetpack Compose**: تضمين مكتبة Navigation Compose الرسمية المحدثة (إصدار أكتوبر 2026).
          draft: false
          prerelease: false
          generate_release_notes: true

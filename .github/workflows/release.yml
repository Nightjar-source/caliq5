name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore Signing Credentials from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > androidApp/Nightjar.keystore
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> local.properties
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> local.properties
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set!"
          fi

      - name: Build Release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find androidApp/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: steps.find_apk.outputs.apk_path != ''
        with:
          name: caliq5-release-apk
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          name: تطبيق كاليك 5 (Caliq 5) - الإصدار ${{ github.ref_name }}
          body: |
            ### 📱 تطبيق كاليك 5 (Caliq 5) - الإصدار ${{ github.ref_name }}

            نسخة رسمية موقعة ومشفرة مبنية تلقائياً عبر مفاتيح التوقيع المشفرة الرسمية في GitHub Actions.

            #### 🌟 تفاصيل التحديث:
            - **تجسيم وتحدب أحجار البحر (Sea Glass Organic Convex Volume)**: تحدب وانحناء عضوي ثلاثي الأبعاد ناعم من جنس اللون وبدون أي ظلال خارجية أو حواف صلبة في كارتات الشرح والمعدل وأشرطة التنقل.
            - **مؤشر سائل متدفق (Fluid Liquid Droplet)**: مؤشر تنقل يحاكي التوتر السطحي لقطرة سائل حقيقية ومرنة في الوضعين الفاتح والمظلم.
            - **معايير أندرويد 2026/2027 للنوافذ العائمة وتقسيم الشاشة**: ضبط دقيق لمسافات الأمان ومقابض التحكم العلوية مع امتداد خلفية التطبيق Edge-to-Edge.
            - **تباين ذكي للنصوص في كارتات الشرح**: كشف ديناميكي لدرجة إضاءة الخلفية وإسقاط ظل تباين ناعم لحساب وضوح النص وفق معايير WCAG.
            - **سلاسة فورية للمنسدلات والصفحات الداخلية**: معالجة التلعثم والرمشات عند الفتح الأول لمنسدلات الصفوف وقوائم الألوان وسجل الدرجات دون تغيير في التصميم.
            - **تنظيف عميق وسريع للذاكرة والكاش عند الإغلاق**: حذف فوري للملفات المؤقتة متوافق مع واجهات أجهزة Samsung و Xiaomi بدون أي تعليق أو بطء.
          draft: false
          prerelease: false
          generate_release_notes: true

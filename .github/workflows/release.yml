name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore Signing Credentials from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > androidApp/Nightjar.keystore
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> local.properties
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> local.properties
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set!"
          fi
          if [ -n "${{ secrets.ADMOB_APP_ID }}" ]; then
            echo "ADMOB_APP_ID=${{ secrets.ADMOB_APP_ID }}" >> local.properties
          fi
          if [ -n "${{ secrets.ADMOB_BANNER_ID }}" ]; then
            echo "ADMOB_BANNER_ID=${{ secrets.ADMOB_BANNER_ID }}" >> local.properties
          fi
          if [ -n "${{ secrets.ADMOB_INTERSTITIAL_ID }}" ]; then
            echo "ADMOB_INTERSTITIAL_ID=${{ secrets.ADMOB_INTERSTITIAL_ID }}" >> local.properties
          fi

      - name: Build Release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find androidApp/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          NAMED_APK="androidApp/build/outputs/apk/release/caliq5-${{ github.ref_name }}.apk"
          cp "$APK_PATH" "$NAMED_APK"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "named_apk=$NAMED_APK" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: steps.find_apk.outputs.apk_path != ''
        with:
          name: caliq5-release-apk
          path: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.find_apk.outputs.named_apk }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.find_apk.outputs.named_apk }}
          name: حاسبة الإعفاء والسعي لطلاب وطالبات العراق - تطبيق كاليك 5 (Caliq 5) ${{ github.ref_name }}
          body: |
            ### 🎓 حاسبة الإعفاء والسعي لطلاب وطالبات العراق - تطبيق كاليك 5 (Caliq 5) - الإصدار ${{ github.ref_name }}

            تطبيق تعليمي ذكي مخصص لطلاب وطالبات المراحل الدراسية في جمهورية العراق لحساب السعي السنوي، وتحديد شروط الإعفاء العام والفردي، وحساب المعدلات الفصلية وإدارة سجل الدرجات بأحدث تقنيات أندرويد وCompose Multiplatform.

            نسخة رسمية موقّعة ومشفرة تم بناؤها تلقائياً عبر مفاتيح التوقيع المشفرة الرسمية في GitHub Actions.

            #### 🌟 تفاصيل تحديث الإصدار ${{ github.ref_name }}:
            1. **إرجاع تدرج كارت الشرح الشفاف إلى 10% مع ظلال هالة ضبابية غاوسية ناعمة (Gaussian Aura)**: استعادة تدرج الـ 10% فائق النقاء وتطبيق هالة ضبابية متكيفة بدون إزاحة مكررة للأحرف لمنع أي تكرار أو تشويش للنصوص وتحقيق أعلى وضوح وتباين WCAG AAA على الأجزاء الشفافة للوضع الفاتح والداكن.
            2. **تجسيم وتحدب ثلاثي الأبعاد أصلي متقدم من جنس اللون نفسه**: اشتقاق التحدب الحجمي والضوء الانعكاسي مباشرة من نفس درجة لون الثيم (Tone-on-tone Convexity) بدون أي ظلال سفلية معتمة أو بطيئة، مع مظهر بلوري انسيابي لكارتات الشرح والدرجات والسجل.
            3. **شريط التنقل بدرجة شفافية 80% وأيقونة القائمة الجانبية المدمجة**: ضبط شفافية شريط التنقل السفلي والجانبي إلى 80%، وتصغير زر القائمة الجانبية المتطابق مع ارتفاع الشريط (48dp) مع مؤشر قطرة زجاجي سائل وأيقونات واضحة الألوان في الوضعين الفاتح والمظلم.
            4. **تسريع التحميل الكسول (Lazy Lists & Grids)**: تحسين أداء قوائم وسجلات الشاشات (درجاتي، التعليمات، الأخبار، التحديثات، حول التطبيق) بمفاتيح مستقرة وتخزين استباقي لمنع أي تهنيج أو تسقيط للإطارات.
            5. **حماية مسار التنقل Navigation 3 ومتعدد المنصات (Compose Multiplatform Navigation 3)**: معالجة توقف زر الرجوع عند التدوير بين الوضع الأفقي والعمودي والمطويات عبر عزل التهيئة وحماية مكدس التنقل بالكامل ودعم حواف الشاشات والنوافذ العائمة (Freeform Pop-up Windows).
            6. **حبات الملح العضوية الـ 28**: الحفاظ التام على حبات الملح الـ 28 الطافية حول الكارتات بزاوية 360 درجة.
            7. **شاشة البداية الأصلية لـ أندرويد (Splash Screen)**: تدرج شاشة البداية الأصلي المتطابق بدقة من أندرويد 7 حتى 17.
            8. **تنظيف فوري للذاكرة المؤقتة والكاش عند الإغلاق والسحب**: خدمة تنظيف فوري عبر `CaliqCleanupService` ودالة `onTaskRemoved` متوافقة مع Samsung One UI وXiaomi HyperOS.
            9. **دعم النوافذ العائمة وتقسيم الشاشة**: دعم كامل لـ Freeform Windows وSplit-Screen وSamsung DeX ومسافات أمان علوية لكافة الشاشات.
          draft: false
          prerelease: false
          generate_release_notes: true

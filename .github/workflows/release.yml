name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore Signing Credentials from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > androidApp/Nightjar.keystore
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> local.properties
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> local.properties
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set!"
          fi

      - name: Build Release APK
        run: ./gradlew :androidApp:assembleRelease --no-daemon --stacktrace

      - name: Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find androidApp/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          NAMED_APK="androidApp/build/outputs/apk/release/caliq5-${{ github.ref_name }}.apk"
          cp "$APK_PATH" "$NAMED_APK"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "named_apk=$NAMED_APK" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: steps.find_apk.outputs.apk_path != ''
        with:
          name: caliq5-release-apk
          path: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.find_apk.outputs.named_apk }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.find_apk.outputs.named_apk }}
          name: حاسبة الإعفاء والسعي لطلاب وطالبات العراق - تطبيق كاليك 5 (Caliq 5) ${{ github.ref_name }}
          body: |
            ### 🎓 حاسبة الإعفاء والسعي لطلاب وطالبات العراق - تطبيق كاليك 5 (Caliq 5) - الإصدار ${{ github.ref_name }}

            تطبيق تعليمي ذكي مخصص لطلاب وطالبات المراحل الدراسية في جمهورية العراق لحساب السعي السنوي، وتحديد شروط الإعفاء العام والفردي، وحساب المعدلات الفصلية وإدارة سجل الدرجات بأحدث تقنيات أندرويد وCompose Multiplatform.

            نسخة رسمية موقّعة ومشفرة تم بناؤها تلقائياً عبر مفاتيح التوقيع المشفرة الرسمية في GitHub Actions.

            #### 🌟 تفاصيل تحديث الإصدار ${{ github.ref_name }}:
            1. **فصل اسم التطبيق في لانشر الهاتف والمتاجر**: يظهر التطبيق في شاشة الهاتف الرئيسية باسم `حاسبة الاعفاء والسعي` لمنع اقتطاع الاسم، بينما يبقى في GitHub والمتجر وإعدادات النظام بالاسم الكامل `حاسبة الإعفاء والسعي لطلاب وطالبات العراق - تطبيق كاليك 5 (Caliq 5)`.
            2. **اعتماد مكتبة التنقل الرسمية الأحدث Navigation 3**: دمج وتحديث مكتبات Navigation 3 الرسمية من Google (`androidx.navigation3:navigation3-runtime` و `navigation3-ui`) لدعم أحدث معايير التنقل لـ Jetpack Compose.
            3. **حبات الملح العضوية الـ 28 وإزالة الظلال المتأخرة**: الحفاظ الكامل على حبات الملح الـ 28 الطافية حول الكارتات بزاوية 360 درجة مع إزالة الظلال السفلية والخطوط المعيقة أسفل كارتات الشرح والدرجات وشريط التنقل.
            4. **إصلاح شاشة البداية لنظام أندرويد (Android Splash Screen)**: استعادة التدرج اللوني الأصلي لشاشة البداية في Android 12-16 لمنع ظهور الشاشة السوداء المؤقتة عند الإقلاع البارد.
            5. **ظلال نصوص ذكية فائقة التباين لكارتات الشرح**: موازنة تباين نصوص وعناوين الكارتات في الوضع الفاتح والمظلم بظلال ناصعة وخلفيات تباين 100% متوافقة مع معايير WCAG وMaterial 3.
            6. **سلاسة فورية لمنسدلة الألوان وحواف ناعمة**: معالجة إغلاق منسدلة الألوان والمظهر لتطابق شاشة التعليمات بدون أي تأخير في الحواف عبر تقييد الإطار اللحظي.
            7. **شريط التنقل والمؤشر السائل المتدفق**: أيقونات فائقة الوضوح في الوضعين الفاتح والمظلم مع تجسيم زجاجي عضوي وحركة قطرة السائل المرنة.
            8. **تنظيف فوري للذاكرة والكاش عند الإغلاق وسحب التطبيق**: استخدام خدمة `CaliqCleanupService` عبر دالة `onTaskRemoved` لحذف الملفات المؤقتة والذاكرة مباشرة عند سحب التطبيق المتوافق من أندرويد 7 إلى 17 وواجهات Samsung وXiaomi.
            9. **دعم النوافذ العائمة وتقسيم الشاشة**: دعم كامل لـ Freeform Windows وSplit-Screen وSamsung DeX مع مسافات الأمان المناسبة.
          draft: false
          prerelease: false
          generate_release_notes: true
